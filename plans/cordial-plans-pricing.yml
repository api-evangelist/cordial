gap: >-
  A developer evaluating Cordial cannot size cost, entitlement or API quota before entering a sales
  process. For a platform that now markets itself as headless and agent-addressable
  (developers.cordial.com, "Cordial Headless — now in preview"), the absence of any published
  commercial surface is the single largest friction between an interested developer and a first API
  call.

