note: >-
  Derived mechanically from both published Swagger documents, then upgraded from the provider's own
  authentication documentation and from the live OAuth discovery metadata served by the MCP endpoint.
  Cordial runs TWO distinct auth models on two different surfaces, which the OpenAPI alone does not
  reveal: long-lived HTTP Basic API keys on REST, and OAuth 2.1 on MCP and the CLI.

