  with the page body as evidence. Only frameworks Cordial names on its own page are listed.

certifications:
- name: SOC 2 Type II
  status: compliant
  claim: 'Demands rigorous security policy creation, adherence and auditing. Cordial is SOC 2 Type II compliant.'
  report_available: unknown
  note: No public report request flow or automated NDA-gated portal was found.

regulatory_alignment:
- name: GDPR
  status: compliant
  claim: 'Cordial is GDPR and CCPA compliant.'
- name: CCPA
  status: compliant
  claim: 'Cordial is GDPR and CCPA compliant.'
- name: EU-U.S. Privacy Shield / Swiss-U.S. Privacy Shield
  status: claimed
  claim: 'Cordial complies with the EU-U.S. Privacy Shield Framework and Swiss-U.S. Privacy Shield Framework as set forth by the U.S. Department of Commerce.'
  caveat: >-
    A live-site accuracy issue worth flagging to the provider: the EU-U.S. Privacy Shield was invalidated
    by the CJEU in July 2020 (Schrems II) and the Swiss-U.S. framework was likewise superseded. The
    successor is the EU-U.S. Data Privacy Framework. Cordial's own privacy policy at
    legal.cordial.com does reference dataprivacyframework.gov, so the security page appears to be stale
    rather than the underlying posture being wrong.

channel_compliance:
  note: >-
    Cordial's messaging-channel documentation additionally cites compliance tooling for TCPA, CTIA,
    HIPAA and GDPR in the SMS/MMS channel. These are described as compliance FEATURES of the product
    (consent capture, quiet hours, opt-out handling), not as certifications Cordial holds.
  frameworks: [TCPA, CTIA, HIPAA, GDPR]
  source: https://cordial.com/platform/messaging-channels/sms-marketing/

privacy:
