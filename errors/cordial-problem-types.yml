gaps:
- 429 Too Many Requests is a real, documented response (with X-Rate-Limit-* and Retry-After headers) but appears
  on ZERO of the 106 v2 operations in the published spec.
- 62 of 115 declared 404 responses and 30 of 71 declared 422 responses carry an EMPTY description, so an agent gets
  a status code and no semantics.
- No response examples are declared anywhere in either spec; no operation-level parameter examples either.
- The 401 response schema types `error` as a string while every other error response types it as a boolean.
