- aid: cordial:cordial-api-v1
  name: Cordial API v1
  description: 'The legacy Cordial REST API, still published and documented alongside
    v2. 83 operations across 50 paths covering the same contact, event, order,
    product, supplement, list, message and job surface at an earlier revision. New
    integrations are directed to v2.'
