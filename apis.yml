apis:
- aid: cordial:cordial-api-v2
  name: Cordial API v2
  description: 'The current Cordial REST API. 106 operations across 24 resource groups:
    contacts, contact activities, orders, products, supplements, account lists,
    contact attributes, batch messages, automation templates, orchestrations, data
    jobs, contact/order/product imports and exports, jobs, alerts, message content
    includes, programs, and analytics exports. JSON in, JSON out, over HTTPS only,
    authenticated with HTTP Basic using an account API key as the username and a
    blank password.'
  humanURL: https://developers.cordial.com/api
  baseURL: https://api.cordial.io/v2
