aid: cordial
name: Cordial
description: 'Cordial is a cross-channel marketing and customer data platform headquartered
  in San Diego, California, used by consumer brands to unify customer data and orchestrate
  personalized messaging across email, SMS/MMS, RCS, mobile app (push, in-app, mobile
  inbox), website, and any external channel reachable over REST. The platform combines
  a native customer data platform built on a document database, real-time journey
  orchestration, identity resolution, and the Cordial Edge AI suite of brand-specific
  predictive models. Cordial is API-first: a documented Swagger 2.0 REST API at
  api.cordial.io exposes 106 operations across 24 resource groups covering contacts,
  contact activities, orders, products, supplements, lists, attributes, batch messages,
  automation templates, orchestrations, data jobs, imports/exports, alerts, and
  analytics. Alongside REST it publishes a hosted Model Context Protocol server with
  56 read tools over 17 domains, a first-party npm CLI, mobile SDKs for iOS, Android,
  React Native and Expo, an embedded JavaScript listener, configurable outbound
  webhooks, and an open-source cookbook of packaged Claude Agent Skills.'
url: https://raw.githubusercontent.com/api-evangelist/cordial/refs/heads/main/apis.yml
