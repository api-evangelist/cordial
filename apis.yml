  name: Cordial MCP Server
  description: >-
    Cordial's hosted Model Context Protocol server, which gives any MCP client secure read access to a
    Cordial account: audiences, messages, analytics, content, orchestrations, sculpt blocks and templates,
    reports, channels, data operations, supplements, products and tags. 56 tools across 17 domains, served
    over streamable HTTP and protected by OAuth 2.1 with dynamic client registration. Writes are described
    as forthcoming behind human approval.
