assessment: >-
  The two surfaces are close to disjoint in intent rather than overlapping projections of one core.
  MCP is a read/analysis plane over objects REST largely does not expose (audiences, sculpt, images,
  saved reports, AI insight reports, tags, channels, transports, semantic search) — 27 of 56 tools
  have no REST operation at all. REST is a write/ingest plane over the data model — 82 of 106
  operations have no tool. Only 24 REST operations are reachable from an agent. Any consumer that
  assumes the MCP server is "the API for agents" will find it cannot create a contact, log an event,
  or send a message; and any consumer that assumes REST is the whole platform will not find audiences,
  sculpt content, or the AI insight layer. Both surfaces are needed, and the tool crosswalk is the
  only place that fact is written down.
