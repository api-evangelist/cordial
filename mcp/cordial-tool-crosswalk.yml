note: >-
  Binds each published Cordial MCP tool to the REST operation(s) that back it. The MCP server's live
  tools/list is OAuth-gated (401 on anonymous introspection), so no inputSchema was captured; the
  mapping below is by name and documented semantics against verified v2 operationIds, and every
  confidence value reflects that. Where a binding is high confidence, the tool's REAL input contract
  is that operation's `parameters` + `body` schema in openapi/cordial-v2-openapi-original.json.
  Nothing here is fabricated: every operationId named was grepped out of the published spec, and
  tools with no public REST equivalent are recorded in mcp_only[] rather than mapped to something
  approximate.

surfaces:
  openapi:
    file: openapi/cordial-v2-openapi-original.json
    spec: Swagger 2.0
    base_url: https://api.cordial.io/v2
    operations: 106
    auth: HTTP Basic (API key as username, blank password)
    gated: false
  mcp:
    url: https://mcp.cordial.io/mcp
    transport: http
    tools: 56
    auth: OAuth 2.1 (authorization_code + refresh_token, DCR, PKCE S256)
    scopes: [read, profile]
    gated: true
    gate_note: 'tools/list returned 401 invalid_token on 2026-08-04; schemas require an authenticated account session.'
  graphql:
    present: false
  cli:
    package: '@cordialexperience/cosdk'
    note: >-
      The CLI is a third projection of the same core. Its command groups (analytics, messages,
      contacts, audiences, content, orchestrations, data, jobs, supplements, products, tags) line up
      with the MCP domains far more closely than with the REST resource groups, which is a strong
      signal that CLI and MCP share a service layer that sits above the public v2 REST API.

