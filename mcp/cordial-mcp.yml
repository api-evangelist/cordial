server:
  name: cordial
  transport: http
  url: https://mcp.cordial.io/mcp
  access: read-only
  note: >-
    Cordial ships a hosted, first-party MCP server that gives an MCP client secure read access to a
    Cordial account. The provider describes the scope as "Read (writes coming soon with human
    approval)". It was announced in the June 2026 monthly release notes as "a new and significantly
    more powerful version of the Cordial MCP Server".

