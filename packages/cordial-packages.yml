client_libraries_for_rest_api:
  status: none
  note: >-
    Cordial publishes no server-side REST client library in any language. The REST API is documented
    as plain HTTPS + HTTP Basic and exercised through the hosted Swagger console at
    https://api.cordial.io/docs/v2/. The packages above are mobile data-collection SDKs, the CLI, and
    MCP tooling — none of them wraps the 106-operation v2 REST surface.

