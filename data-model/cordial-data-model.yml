- {from: DataJob, to: Supplement, type: has_many, via: 'transform source/destination', note: 'The dependency edge the provider''s own data-dependency-trace skill walks backwards.'}
- {from: Job, to: 'Contact | Order | Product | Supplement', type: has_one, via: 'import/export target', note: 'Every bulk operation is async: POST returns a jobID, then poll getsinglejob.'}
