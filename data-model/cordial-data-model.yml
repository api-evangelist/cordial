async_pattern:
  description: >-
    All bulk work is job-based. POST /v2/contactimports, /v2/contactexports, /v2/contactactivityexport,
    /v2/ordersimport, /v2/productimports, /v2/accountmonitorexport, /v2/audiencetrendsexport,
    /v2/messageanalyticsexport and /v2/supplements/{supplement}/imports each return a job, which is then
    polled via GET /v2/jobs/{id}.
  initiators: [createImportJob, createExportJob, createExportCAJob, ordersimport, productimport, exportAccountMonitor, audiencetrendsexport, exportMessageAnalytics, importsupplementrecords]
  poller: getsinglejob

